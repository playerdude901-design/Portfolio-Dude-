<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Builder · Dude 3D</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: #0B1324;
            color: #fff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* ── HEADER ── */
        .builder-header {
            position: sticky; top:0; z-index:100;
            display:flex; align-items:center; justify-content:space-between;
            padding:.75rem 1.8rem;
            background:rgba(11,19,36,.88); backdrop-filter:blur(18px);
            border-bottom:1px solid rgba(148,163,184,.06);
        }
        .builder-header h1 {
            font-weight:700; font-size:1rem; letter-spacing:-.02em;
        }
        .builder-header h1 span { color:#3B82F6; }
        .builder-header .star { font-size:1.1rem; margin-left:2px; }
        .builder-header .hint {
            font-size:.7rem; color:#5a6a7e;
        }
        .builder-header .close-btn {
            background:rgba(148,163,184,.06); border:1px solid rgba(148,163,184,.1);
            color:#b0baca; width:30px; height:30px; border-radius:8px;
            display:flex; align-items:center; justify-content:center;
            text-decoration:none; font-size:.85rem; transition:background .2s,color .2s;
        }
        .builder-header .close-btn:hover { background:rgba(148,163,184,.12); color:#fff; }

        /* ── BUILDER LAYOUT ── */
        .builder {
            display:flex; gap:0; min-height:calc(100vh - 53px);
        }

        /* ── LEFT COLUMN ── */
        .services-col {
            flex:1; padding:1.8rem 1.8rem 2rem;
            overflow-y:auto;
        }
        .services-col .col-title {
            font-size:1.3rem; font-weight:700; margin-bottom:.4rem;
        }
        .services-col .col-sub {
            font-size:.82rem; color:#5a6a7e; margin-bottom:1.5rem;
        }
        .service-grid {
            display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
            gap:1rem;
        }

        /* ── SERVICE CARD ── */
        .svc-card {
            background:linear-gradient(145deg,#141d30,#101827);
            border:1px solid rgba(148,163,184,.08);
            border-radius:16px; padding:1.2rem 1.2rem 1rem;
            transition:transform .25s cubic-bezier(.16,1,.3,1),border-color .3s,box-shadow .3s;
            position:relative;
        }
        .svc-card:hover {
            transform:translateY(-3px);
            border-color:rgba(59,130,246,.15);
            box-shadow:0 8px 40px rgba(0,0,0,.25);
        }
        .svc-card .svc-icon {
            font-size:1.6rem; margin-bottom:.3rem;
        }
        .svc-card .svc-name {
            font-weight:700; font-size:.95rem; margin-bottom:.2rem;
        }
        .svc-card .svc-desc {
            font-size:.78rem; color:#6b7a8e; line-height:1.5; margin-bottom:.6rem;
        }
        .svc-card .svc-price {
            font-size:.85rem; font-weight:600; color:#60a5fa; margin-bottom:.7rem;
        }
        .svc-card .svc-price small {
            font-weight:400; font-size:.75rem; color:#5a6a7e;
        }

        .add-btn {
            width:100%; padding:.5rem 0; border-radius:10px;
            font-weight:600; font-size:.8rem; font-family:inherit;
            cursor:pointer; transition:all .25s; border:none;
            background:linear-gradient(135deg,#3B82F6,#2563eb);
            color:#fff;
        }
        .add-btn:hover { filter:brightness(1.1); transform:scale(1.02); }
        .add-btn.added {
            background:rgba(34,197,94,.15); color:#22c55e;
            border:1px solid rgba(34,197,94,.25);
            cursor:default;
        }
        .add-btn.added:hover { filter:none; transform:none; }

        /* ── RIGHT COLUMN ── */
        .project-col {
            width:400px; min-width:400px;
            padding:1.8rem 1.5rem 2rem;
            background:rgba(16,24,39,.5);
            border-left:1px solid rgba(148,163,184,.06);
            overflow-y:auto;
            display:flex; flex-direction:column;
            position:sticky; top:53px; height:calc(100vh - 53px);
        }
        .project-col .col-title {
            font-size:1.1rem; font-weight:700; margin-bottom:.3rem;
        }
        .project-col .col-title .star { font-size:.95rem; margin-left:2px; }
        .project-col .col-sub {
            font-size:.78rem; color:#5a6a7e; margin-bottom:1.2rem;
        }

        .project-empty {
            text-align:center; padding:2.5rem 1rem;
            color:#5a6a7e; font-size:.85rem; line-height:1.6;
        }

        .project-items { flex:1; overflow-y:auto; margin-bottom:1rem; }

        /* ── PROJECT ITEM ── */
        .p-item {
            background:linear-gradient(135deg,#141d30,#101827);
            border:1px solid rgba(148,163,184,.08);
            border-radius:14px; padding:0;
            margin-bottom:.7rem;
            animation:pItemIn .3s cubic-bezier(.16,1,.3,1);
        }
        @keyframes pItemIn {
            from { opacity:0; transform:scale(.95) translateY(6px); }
            to   { opacity:1; transform:scale(1) translateY(0); }
        }
        .p-item.removing {
            animation:pItemOut .25s ease forwards;
        }
        @keyframes pItemOut {
            to { opacity:0; transform:scale(.94) translateY(-8px); max-height:0; padding:0; margin-bottom:0; overflow:hidden; }
        }

        .p-item-header {
            display:flex; align-items:center; gap:.5rem;
            padding:.75rem .85rem .65rem;
            cursor:pointer;
        }
        .p-item-header .pi-icon { font-size:1.2rem; }
        .p-item-header .pi-name { font-weight:600; font-size:.85rem; flex:1; }
        .p-item-header .pi-price { font-size:.82rem; font-weight:600; color:#60a5fa; }
        .p-item-header .pi-toggle {
            font-size:.7rem; color:#5a6a7e; transition:transform .25s;
            margin-left:.2rem;
        }
        .p-item-header .pi-toggle.open { transform:rotate(180deg); }
        .p-item-actions {
            display:flex; gap:.4rem; padding:0 .85rem .65rem;
        }
        .p-item-actions button {
            background:rgba(148,163,184,.06); border:1px solid rgba(148,163,184,.08);
            color:#6b7a8e; padding:.25rem .65rem; border-radius:6px;
            font-size:.72rem; font-weight:500; cursor:pointer; font-family:inherit;
            transition:background .2s,color .2s;
        }
        .p-item-actions button:hover { background:rgba(148,163,184,.12); color:#b0baca; }
        .p-item-actions .pi-del:hover { background:rgba(239,68,68,.15); color:#ef4444; border-color:rgba(239,68,68,.2); }

        /* ── SERVICE OPTIONS ── */
        .p-item-options {
            padding:0 .85rem .85rem;
            display:none; flex-direction:column; gap:.6rem;
            border-top:1px solid rgba(148,163,184,.06);
            padding-top:.7rem; margin-top:.1rem;
        }
        .p-item-options.open { display:flex; }
        .opt-group {
            background:rgba(11,19,36,.4); border-radius:10px;
            padding:.4rem .5rem .2rem;
            animation:optIn .2s ease;
        }
        @keyframes optIn {
            from { opacity:0; transform:translateY(-3px); }
            to   { opacity:1; transform:translateY(0); }
        }
        .opt-group .opt-label {
            font-size:.7rem; font-weight:600; color:#5a6a7e; text-transform:uppercase;
            letter-spacing:.04em; margin-bottom:.3rem; padding:0 .3rem;
        }
        .opt-group .opt-choices {
            display:flex; flex-wrap:wrap; gap:.3rem;
        }
        .opt-choice {
            flex:1; min-width:60px;
            padding:.3rem .5rem; border-radius:7px;
            font-size:.72rem; font-weight:500; font-family:inherit;
            background:rgba(148,163,184,.06); border:1px solid rgba(148,163,184,.08);
            color:#b0baca; cursor:pointer; transition:all .2s;
            text-align:center;
        }
        .opt-choice:hover { background:rgba(148,163,184,.1); border-color:rgba(148,163,184,.15); }
        .opt-choice.selected {
            background:rgba(59,130,246,.15); border-color:#3B82F6; color:#fff;
        }

        /* ── SUMMARY ── */
        .project-summary {
            border-top:1px solid rgba(148,163,184,.08);
            padding-top:.8rem; margin-top:auto;
        }
        .summary-title {
            font-size:.8rem; font-weight:700; color:#b0baca; margin-bottom:.5rem;
        }
        .summary-row {
            display:flex; justify-content:space-between; align-items:center;
            padding:.15rem 0; font-size:.78rem;
        }
        .summary-row .sl { color:#6b7a8e; }
        .summary-row .sv { color:#b0baca; font-weight:500; }
        .summary-row.total {
            border-top:1px solid rgba(148,163,184,.08);
            padding-top:.4rem; margin-top:.3rem;
        }
        .summary-row.total .sl { color:#fff; font-weight:600; font-size:.82rem; }
        .summary-row.total .sv { color:#60a5fa; font-weight:700; font-size:.9rem; }
        .summary-row.time-row .sv { color:#22c55e; }

        .project-summary .summary-details {
            margin:.4rem 0 .2rem;
        }
        .summary-detail-item {
            font-size:.74rem; color:#6b7a8e; padding:.08rem 0;
            padding-left:.8rem; position:relative;
        }
        .summary-detail-item::before {
            content:'•'; position:absolute; left:.2rem; color:#3B82F6;
        }

        .quote-btn {
            width:100%; padding:.6rem 0; border-radius:12px;
            font-weight:700; font-size:.85rem; font-family:inherit;
            cursor:pointer; transition:all .25s; border:none; margin-top:.6rem;
            background:linear-gradient(135deg,#3B82F6,#2563eb);
            color:#fff; box-shadow:0 4px 25px rgba(59,130,246,.3);
        }
        .quote-btn:hover { transform:translateY(-2px); box-shadow:0 8px 35px rgba(59,130,246,.45); filter:brightness(1.08); }

        /* ── QUOTE OVERLAY ── */
        .quote-overlay {
            display:none; position:fixed; inset:0; z-index:200;
            background:rgba(0,0,0,.6); backdrop-filter:blur(6px);
            align-items:center; justify-content:center;
            padding:1rem;
        }
        .quote-overlay.open { display:flex; }
        .quote-card {
            background:#172033; border:1px solid rgba(148,163,184,.12);
            border-radius:18px; padding:1.8rem; max-width:500px; width:100%;
            box-shadow:0 30px 80px rgba(0,0,0,.5);
            animation:qIn .3s cubic-bezier(.16,1,.3,1);
        }
        @keyframes qIn {
            from { opacity:0; transform:scale(.95) translateY(10px); }
            to   { opacity:1; transform:scale(1) translateY(0); }
        }
        .quote-card h2 { font-weight:700; font-size:1rem; margin-bottom:.1rem; }
        .quote-card .q-sub { font-size:.78rem; color:#6b7a8e; margin-bottom:.8rem; }
        .quote-card pre {
            background:rgba(11,19,36,.6); border:1px solid rgba(148,163,184,.06);
            border-radius:10px; padding:.85rem; font-size:.78rem; color:#b0baca;
            line-height:1.6; white-space:pre-wrap; font-family:'Inter',sans-serif;
            margin-bottom:.8rem; user-select:all; max-height:280px; overflow-y:auto;
        }
        .q-actions { display:flex; gap:.5rem; flex-wrap:wrap; }
        .q-actions button {
            flex:1; min-width:120px; padding:.5rem .8rem; border-radius:9px;
            font-size:.78rem; font-weight:500; cursor:pointer; transition:background .2s;
            font-family:inherit; border:none;
        }
        .q-actions .q-copy { background:#3B82F6; color:#fff; }
        .q-actions .q-copy:hover { background:#2563eb; }
        .q-actions .q-wa { background:#25D366; color:#fff; }
        .q-actions .q-wa:hover { background:#1da851; }
        .q-actions .q-mail { background:rgba(148,163,184,.08); color:#b0baca; }
        .q-actions .q-mail:hover { background:rgba(148,163,184,.15); color:#fff; }
        .q-actions .q-close { background:rgba(148,163,184,.06); color:#5a6a7e; }
        .q-actions .q-close:hover { background:rgba(148,163,184,.12); color:#b0baca; }

        /* ── SCROLLBAR ── */
        ::-webkit-scrollbar { width:5px; }
        ::-webkit-scrollbar-track { background:transparent; }
        ::-webkit-scrollbar-thumb { background:rgba(148,163,184,.12); border-radius:10px; }
        ::-webkit-scrollbar-thumb:hover { background:rgba(148,163,184,.2); }

        /* ── RESPONSIVE ── */
        @media(max-width:860px) {
            .builder { flex-direction:column; }
            .project-col {
                width:100%; min-width:0;
                position:static; height:auto; border-left:none;
                border-top:1px solid rgba(148,163,184,.06);
            }
            .services-col { padding:1.2rem 1rem; }
            .project-col { padding:1.2rem 1rem; }
            .service-grid { grid-template-columns:1fr 1fr; }
        }
        @media(max-width:500px) {
            .service-grid { grid-template-columns:1fr; }
            .builder-header h1 { font-size:.9rem; }
            .builder-header .hint { display:none; }
        }
    </style>
</head>
<body>

    <header class="builder-header">
        <h1>Project <span>Builder</span><span class="star">⭐</span></h1>
        <span class="hint">Agrega servicios y configura tu proyecto</span>
        <a href="index.html" class="close-btn">✕</a>
    </header>

    <div class="builder">

        <!-- LEFT ─ Services -->
        <div class="services-col">
            <div class="col-title">Servicios</div>
            <div class="col-sub">Selecciona los servicios que necesitas para tu proyecto</div>
            <div class="service-grid" id="service-grid"></div>
        </div>

        <!-- RIGHT ─ Project -->
        <div class="project-col" id="project-col">
            <div class="col-title">Project Builder<span class="star">⭐</span></div>
            <div class="col-sub">Tu proyecto personalizado</div>
            <div class="project-items" id="project-items">
                <div class="project-empty" id="project-empty">
                    Aún no has agregado servicios.<br>
                    Selecciona uno de la lista para empezar.
                </div>
            </div>
            <div class="project-summary" id="project-summary"></div>
            <button class="quote-btn" id="quote-btn" style="display:none">Solicitar Cotización</button>
        </div>

    </div>

    <!-- QUOTE OVERLAY -->
    <div class="quote-overlay" id="quote-overlay">
        <div class="quote-card">
            <h2>Tu Cotización</h2>
            <div class="q-sub">Copia el mensaje o envíalo directamente</div>
            <pre id="quote-text"></pre>
            <div class="q-actions">
                <button class="q-copy" onclick="copyQuote()">📋 Copiar</button>
                <button class="q-wa" onclick="sendWhatsApp()">💬 WhatsApp</button>
                <button class="q-mail" onclick="sendEmail()">✉️ Correo</button>
                <button class="q-close" onclick="closeQuote()">Cerrar</button>
            </div>
        </div>
    </div>

    <script>
        // ── SERVICE DEFINITIONS ──
        const SERVICES = [
            {
                id:'video-editing', name:'Video Editing', icon:'🎬',
                desc:'Edición profesional para videos de YouTube, vlogs y contenido informativo.',
                basePrice:50, baseTime:3,
                options:[
                    { key:'duration', label:'Duración del video', choices:[
                        { l:'<5 min', v:'5min', p:0, t:0 },
                        { l:'5-10 min', v:'10min', p:15, t:1 },
                        { l:'10-20 min', v:'20min', p:25, t:2 },
                        { l:'>20 min', v:'30min', p:50, t:3 },
                    ]},
                    { key:'level', label:'Nivel de edición', choices:[
                        { l:'Básico', v:'basic', p:0, t:0 },
                        { l:'Estándar', v:'standard', p:20, t:1 },
                        { l:'Premium', v:'premium', p:40, t:2 },
                    ]},
                    { key:'thumbnail', label:'¿Miniatura?', choices:[
                        { l:'Sí', v:'yes', p:10, t:1 },
                        { l:'No', v:'no', p:0, t:0 },
                    ]},
                    { key:'thumbnail-qty', label:'Cantidad miniaturas', depends:{key:'thumbnail',val:'yes'}, choices:[
                        { l:'1', v:'1', p:0, t:0 },
                        { l:'3 Variantes', v:'3', p:5, t:1 },
                        { l:'5', v:'5', p:10, t:1 },
                    ]},
                    { key:'delivery', label:'Entrega', choices:[
                        { l:'Standard (3 días)', v:'standard', p:0, t:0 },
                        { l:'Priority (+50%)', v:'priority', p:null, t:0 },
                    ]},
                ]
            },
            {
                id:'gaming-editing', name:'Gaming Editing', icon:'🎮',
                desc:'Perfecto para gameplays, highlights y funny moments.',
                basePrice:50, baseTime:3,
                options:[
                    { key:'duration', label:'Duración del video', choices:[
                        { l:'<5 min', v:'5min', p:0, t:0 },
                        { l:'5-10 min', v:'10min', p:15, t:1 },
                        { l:'10-20 min', v:'20min', p:25, t:2 },
                        { l:'>20 min', v:'30min', p:50, t:3 },
                    ]},
                    { key:'level', label:'Nivel de edición', choices:[
                        { l:'Básico', v:'basic', p:0, t:0 },
                        { l:'Estándar', v:'standard', p:20, t:1 },
                        { l:'Premium', v:'premium', p:40, t:2 },
                    ]},
                    { key:'thumbnail', label:'¿Miniatura?', choices:[
                        { l:'Sí', v:'yes', p:10, t:1 },
                        { l:'No', v:'no', p:0, t:0 },
                    ]},
                    { key:'thumbnail-qty', label:'Cantidad miniaturas', depends:{key:'thumbnail',val:'yes'}, choices:[
                        { l:'1', v:'1', p:0, t:0 },
                        { l:'3 Variantes', v:'3', p:5, t:1 },
                        { l:'5', v:'5', p:10, t:1 },
                    ]},
                    { key:'delivery', label:'Entrega', choices:[
                        { l:'Standard (3 días)', v:'standard', p:0, t:0 },
                        { l:'Priority (+50%)', v:'priority', p:null, t:0 },
                    ]},
                ]
            },
            {
                id:'shorts-editing', name:'Shorts Editing', icon:'📱',
                desc:'Edición dinámica para Shorts, Reels y TikTok.',
                basePrice:10, baseTime:2,
                options:[
                    { key:'quantity', label:'Cantidad', choices:[
                        { l:'1', v:'1', p:10, t:0 },
                        { l:'2', v:'2', p:20, t:0 },
                        { l:'3', v:'3', p:30, t:1 },
                        { l:'5', v:'5', p:50, t:1 },
                        { l:'10', v:'10', p:100, t:2 },
                    ]},
                    { key:'thumbnail', label:'¿Miniatura?', choices:[
                        { l:'Sí', v:'yes', p:5, t:1 },
                        { l:'No', v:'no', p:0, t:0 },
                    ]},
                    { key:'delivery', label:'Entrega', choices:[
                        { l:'Standard (2 días)', v:'standard', p:0, t:0 },
                        { l:'Priority (+50%)', v:'priority', p:null, t:0 },
                    ]},
                ]
            },
            {
                id:'thumbnail-design', name:'Thumbnail Design', icon:'🖼️',
                desc:'Miniaturas diseñadas profesionalmente para alto CTR.',
                basePrice:10, baseTime:2,
                options:[
                    { key:'quantity', label:'Cantidad', choices:[
                        { l:'1', v:'1', p:10, t:0 },
                        { l:'3 Variantes', v:'3', p:25, t:1 },
                        { l:'5', v:'5', p:40, t:1 },
                    ]},
                    { key:'delivery', label:'Entrega', choices:[
                        { l:'Standard (2 días)', v:'standard', p:0, t:0 },
                        { l:'Priority (+50%)', v:'priority', p:null, t:0 },
                    ]},
                ]
            },
            {
                id:'channel-branding', name:'Channel Branding', icon:'🎨',
                desc:'Identidad visual completa: banner, logo, paleta de colores.',
                basePrice:120, baseTime:5,
                options:[
                    { key:'delivery', label:'Entrega', choices:[
                        { l:'Standard (5 días)', v:'standard', p:0, t:0 },
                        { l:'Priority (+50%)', v:'priority', p:null, t:0 },
                    ]},
                ]
            },
        ];

        // ── STATE ──
        const project = [];  // { serviceId, opts:{key:value}, collapsed:bool }
        const svcGrid = document.getElementById('service-grid');
        const pItems = document.getElementById('project-items');
        const pEmpty = document.getElementById('project-empty');
        const pSummary = document.getElementById('project-summary');
        const quoteBtn = document.getElementById('quote-btn');
        const quoteOverlay = document.getElementById('quote-overlay');
        const quoteText = document.getElementById('quote-text');

        // ── HELPERS ──
        function getSvc(id) { return SERVICES.find(s=>s.id===id); }

        function getChoice(svcKey, val) {
            for (const s of SERVICES) {
                for (const o of s.options) {
                    const c = o.choices.find(c=>c.v===val);
                    if (c) return c;
                }
            }
            return null;
        }

        function findChoice(svcId, optKey, val) {
            const s = getSvc(svcId);
            if (!s) return null;
            const o = s.options.find(op=>op.key===optKey);
            if (!o) return null;
            return o.choices.find(c=>c.v===val) || null;
        }

        // ── RENDER SERVICES ──
        function renderServices() {
            svcGrid.innerHTML = SERVICES.map(s => {
                const added = project.some(p => p.serviceId === s.id);
                return `<div class="svc-card">
                    <div class="svc-icon">${s.icon}</div>
                    <div class="svc-name">${s.name}</div>
                    <div class="svc-desc">${s.desc}</div>
                    <div class="svc-price">Desde <strong>$${s.basePrice} USD</strong> <small>/ proyecto</small></div>
                    <button class="add-btn${added?' added':''}" onclick="${added?'':'addToProject(\''+s.id+'\')'}"
                        ${added?'disabled':''}>${added?'✓ Agregado':'Agregar al Proyecto'}</button>
                </div>`;
            }).join('');
        }

        // ── ADD / REMOVE ──
        function addToProject(svcId) {
            const s = getSvc(svcId);
            if (!s) return;
            const entry = { serviceId:svcId, opts:{}, collapsed:false };
            // Set defaults for top-level options (not dependent)
            s.options.forEach(o => {
                if (!o.depends && o.choices.length) {
                    entry.opts[o.key] = o.choices[0].v;
                }
            });
            // Handle dependent: check if dependency condition is already met
            s.options.forEach(o => {
                if (o.depends && entry.opts[o.depends.key] === o.depends.val && o.choices.length) {
                    entry.opts[o.key] = o.choices[0].v;
                }
            });
            project.push(entry);
            renderServices();
            renderProject();
            // Scroll right column into view on mobile
            const col = document.getElementById('project-col');
            if (col && window.innerWidth <= 860) {
                setTimeout(() => col.scrollIntoView({behavior:'smooth',block:'start'}), 100);
            }
        }

        function removeFromProject(idx) {
            const el = document.querySelector(`.p-item[data-idx="${idx}"]`);
            if (el) el.classList.add('removing');
            setTimeout(() => {
                project.splice(idx, 1);
                renderServices();
                renderProject();
            }, 250);
        }

        function toggleCollapse(idx) {
            const e = project[idx];
            if (e) e.collapsed = !e.collapsed;
            renderProject();
        }

        // ── UPDATE OPTION ──
        function updateOption(idx, key, val) {
            const e = project[idx];
            if (!e) return;
            const s = getSvc(e.serviceId);
            if (!s) return;
            e.opts[key] = val;
            // Handle dependencies: find options that depend on this key
            s.options.forEach(o => {
                if (o.depends && o.depends.key === key) {
                    if (val === o.depends.val) {
                        // Set default for dependent option
                        if (o.choices.length) {
                            e.opts[o.key] = o.choices[0].v;
                        }
                    } else {
                        // Remove dependent option value
                        delete e.opts[o.key];
                    }
                }
            });
            renderProject();
        }

        // ── CALCULATE ──
        function calcService(idx) {
            const e = project[idx];
            const s = getSvc(e.serviceId);
            if (!s) return { price:0, time:s.baseTime, items:[], timeItems:[] };
            let price = s.basePrice;
            let time = s.baseTime;
            const items = [];
            const timeItems = [];
            let priority = false;
            s.options.forEach(o => {
                const val = e.opts[o.key];
                if (!val) return;
                const c = o.choices.find(ch => ch.v === val);
                if (!c) return;
                if (o.key === 'delivery' && val === 'priority') { priority = true; return; }
                if (o.key === 'delivery') return;
                if (c.p !== null && c.p !== undefined) price += c.p;
                if (c.t) { time += c.t; timeItems.push({ label:o.label, detail:c.l }); }
                if (o.key === 'thumbnail-qty') {
                    if (val !== '1') {
                        const map = { '3':'3 Variantes', '5':'5 Miniaturas' };
                        items.push({ label:o.label, detail:map[val]||val });
                    }
                } else if (o.key === 'thumbnail' && val === 'yes') {
                    items.push({ label:o.label, detail:'Miniatura incluida' });
                } else if (c.l) {
                    items.push({ label:o.label, detail:c.l });
                }
            });
            if (priority) { price = Math.round(price * 1.5); time = Math.ceil(time * 0.5); }
            // Determine display time label
            let timeLabel = time + (time===1 ? ' día' : ' días');
            if (priority) timeLabel += ' (Priority)';
            return { price, time, timeLabel, items, timeItems, priority };
        }

        function calcTotal() {
            let totalPrice = 0;
            let maxTime = 0;
            const allItems = [];
            project.forEach((e,i) => {
                const r = calcService(i);
                totalPrice += r.price;
                if (r.time > maxTime) maxTime = r.time;
                const s = getSvc(e.serviceId);
                const details = r.items.map(it => `${it.detail}`);
                allItems.push({ icon:s.icon, name:s.name, details, price:r.price, timeLabel:r.timeLabel });
            });
            return { totalPrice, maxTime, allItems };
        }

        // ── RENDER PROJECT ──
        function renderProject() {
            if (project.length === 0) {
                pEmpty.style.display = 'block';
                pItems.innerHTML = '';
                pSummary.innerHTML = '';
                quoteBtn.style.display = 'none';
                return;
            }
            pEmpty.style.display = 'none';
            quoteBtn.style.display = 'block';

            pItems.innerHTML = project.map((e, idx) => {
                const s = getSvc(e.serviceId);
                if (!s) return '';
                const r = calcService(idx);
                return `<div class="p-item" data-idx="${idx}">
                    <div class="p-item-header" onclick="toggleCollapse(${idx})">
                        <span class="pi-icon">${s.icon}</span>
                        <span class="pi-name">${s.name}</span>
                        <span class="pi-price">$${r.price}</span>
                        <span class="pi-toggle${e.collapsed?'':' open'}">▾</span>
                    </div>
                    <div class="p-item-actions">
                        <button onclick="event.stopPropagation();toggleCollapse(${idx})">${e.collapsed?'Editar':'Contraer'}</button>
                        <button class="pi-del" onclick="event.stopPropagation();removeFromProject(${idx})">Eliminar</button>
                    </div>
                    <div class="p-item-options${e.collapsed?'':' open'}">
                        ${renderOptions(s, e.opts, idx)}
                    </div>
                </div>`;
            }).join('');

            // Summary
            const total = calcTotal();
            let html = `<div class="summary-title">Resumen</div>`;
            if (total.allItems.length) {
                html += `<div class="summary-details">`;
                total.allItems.forEach(item => {
                    html += `<div class="summary-detail-item">${item.icon} ${item.name} — ${item.details.join(', ') || 'Sin configurar'}</div>`;
                });
                html += `</div>`;
            }
            html += `<div class="summary-row time-row"><span class="sl">Entrega estimada</span><span class="sv">${total.maxTime} día${total.maxTime!==1?'s':''}</span></div>`;
            html += `<div class="summary-row total"><span class="sl">Precio total</span><span class="sv">$${total.totalPrice} USD</span></div>`;
            pSummary.innerHTML = html;
        }

        function renderOptions(s, opts, idx) {
            const visibleOpts = s.options.filter(o => {
                if (!o.depends) return true;
                return opts[o.depends.key] === o.depends.val;
            });
            return visibleOpts.map(o => {
                const sel = opts[o.key] || '';
                return `<div class="opt-group">
                    <div class="opt-label">${o.label}</div>
                    <div class="opt-choices">
                        ${o.choices.map(c =>
                            `<button class="opt-choice${sel===c.v?' selected':''}"
                                onclick="updateOption(${idx},'${o.key}','${c.v}')">${c.l}</button>`
                        ).join('')}
                    </div>
                </div>`;
            }).join('');
        }

        // ── QUOTE ──
        function generateQuote() {
            const total = calcTotal();
            let lines = ['Hola Christian,', ''];
            lines.push('Me interesa cotizar el siguiente proyecto:');
            lines.push('');
            project.forEach((e,i) => {
                const s = getSvc(e.serviceId);
                if (!s) return;
                const r = calcService(i);
                lines.push(`• ${s.icon} ${s.name}`);
                r.items.forEach(it => { if (it.detail) lines.push(`  • ${it.detail}`); });
                lines.push('');
            });
            lines.push('Precio total estimado:');
            lines.push(`$${total.totalPrice} USD`);
            lines.push('');
            lines.push(`Entrega estimada: ${total.maxTime} día${total.maxTime!==1?'s':''}`);
            lines.push('');
            lines.push('Quedo atento a tu disponibilidad.');
            return lines.join('\n');
        }

        window.solicitarCotizacion = function() {
            const msg = generateQuote();
            quoteText.textContent = msg;
            quoteOverlay.classList.add('open');
        };

        window.copyQuote = function() {
            const text = quoteText.textContent;
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.querySelector('.q-copy');
                btn.textContent = '✓ Copiado';
                setTimeout(() => btn.textContent = '📋 Copiar', 2000);
            });
        };

        window.sendWhatsApp = function() {
            const text = encodeURIComponent(quoteText.textContent);
            window.open(`https://wa.me/51987654321?text=${text}`, '_blank');
        };

        window.sendEmail = function() {
            const text = encodeURIComponent(quoteText.textContent);
            window.open(`mailto:dude3d@example.com?subject=Cotización Project Builder&body=${text}`, '_blank');
        };

        window.closeQuote = function() {
            quoteOverlay.classList.remove('open');
        };

        // Overlay click to close
        quoteOverlay.addEventListener('click', e => {
            if (e.target === quoteOverlay) closeQuote();
        });

        // ── INIT ──
        renderServices();
        renderProject();
        document.getElementById('quote-btn').addEventListener('click', solicitarCotizacion);
    </script>
</body>
</html>
